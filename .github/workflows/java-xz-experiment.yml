name: Java XZ fork experiment

on:
  push:
    branches: ['experiment/java-xz']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-xz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.repository == 'nieyuanhong/z3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            scripts
            src/api/java
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Java packaging regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_java*.py'
      - name: Prepare current loader and pinned official 5.3.2 native inputs
        run: >-
          python scripts/java/prepare.py --work-dir build/prepared
          --platform linux-x64 --platform linux-arm64 --platform win-x64 --platform osx-arm64
      - name: Assemble standalone standard and XZ platform/all JARs
        run: >-
          python scripts/java/xz_experiment.py build --prepared build/prepared
          --out build/xz-packages --decoder-work build/decoder
          --platform linux-x64 --platform linux-arm64 --platform win-x64 --platform osx-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xz-comparison-jars
          path: |
            build/xz-packages/*.jar
            build/xz-packages/experiment.json
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xz-experiment-manifest
          path: build/xz-packages/experiment.json
          retention-days: 14
  native:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64, architecture: x64, java: '8'}
          - {os: ubuntu-24.04, platform: linux-x64, architecture: x64, java: '17'}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, architecture: aarch64, java: '8'}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, architecture: aarch64, java: '17'}
          - {os: windows-2025, platform: win-x64, architecture: x64, java: '8'}
          - {os: windows-2025, platform: win-x64, architecture: x64, java: '17'}
          - {os: macos-15, platform: osx-arm64, architecture: aarch64, java: '17'}
          - {os: macos-15, platform: osx-arm64, architecture: aarch64, java: '21'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xz-comparison-jars
          path: packages
      - name: Actual loader size, cold/warm/private timings and failure checks
        run: >-
          python scripts/java/xz_experiment.py test --packages packages
          --platform ${{ matrix.platform }} --work build/xz-results --repeats 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xz-results-${{ matrix.platform }}-java${{ matrix.java }}
          path: |
            build/xz-results/receipt.json
            build/xz-results/logs/*.log
            build/xz-results/compile.log
          retention-days: 14
  verify:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xz-experiment-manifest
          path: manifest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: xz-results-*
          path: receipts
      - name: Check exact JAR hashes, source/run identity and all eight receipts
        run: >-
          python scripts/java/xz_experiment.py summarize --manifest manifest/experiment.json
          --receipts receipts --out build/verified
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xz-verified-report
          path: build/verified/summary.json
          retention-days: 14
